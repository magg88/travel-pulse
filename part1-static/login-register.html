<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelPulse - Најава / Регистрација</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Навигација -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pastel shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="index.html">
                <span>✈️</span> TravelPulse
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="main-nav"></ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="/api-docs" target="_blank" class="btn btn-sm btn-outline-light rounded-3">Swagger API</a>
                    <div id="user-info" class="text-white"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark">Добредојдовте во TravelPulse 🌸</h1>
            <p class="text-muted">Најавете се или креирајте нов профил за да пристапите до вашите патувања.</p>
        </div>

        <div class="row g-4 justify-content-center">
            <!-- Најава -->
            <div class="col-md-5">
                <div class="card card-pastel p-4 h-100 border-0 shadow-sm rounded-4">
                    <h3 class="fw-bold text-dark mb-4 text-center">🔑 Најава</h3>
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Е-пошта (Email)</label>
                            <input type="email" id="login-email" class="form-control rounded-3" placeholder="vasiot@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Лозинка</label>
                            <input type="password" id="login-password" class="form-control rounded-3" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 shadow-sm fw-bold">Влез во системот</button>
                    </form>
                </div>
            </div>

            <!-- Регистрација -->
            <div class="col-md-5">
                <div class="card card-pastel p-4 h-100 border-0 shadow-sm rounded-4">
                    <h3 class="fw-bold text-dark mb-4 text-center">📝 Регистрација</h3>
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Корисничко име</label>
                            <input type="text" id="reg-username" class="form-control rounded-3" placeholder="Марко" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Е-пошта (Email)</label>
                            <input type="email" id="reg-email" class="form-control rounded-3" placeholder="vasiot@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Лозинка</label>
                            <input type="password" id="reg-password" class="form-control rounded-3" placeholder="••••••••" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Улога</label>
                            <select id="reg-role" class="form-select rounded-3">
                                <option value="viewer">Viewer (Гледач)</option>
                                <option value="editor">Editor (Уредник)</option>
                                <option value="admin">Admin (Администратор)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-outline-secondary w-100 rounded-3 py-2 fw-bold">Креирај Профил</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
