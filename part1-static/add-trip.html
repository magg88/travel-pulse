<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelPulse - Додади ново патување</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Навигација -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">✈️ TravelPulse</a>
            <div class="navbar-nav">
                <a class="nav-link" href="trips-list.html">Мои патувања</a>
                <a class="nav-link active" href="add-trip.html">Ново патување</a>
                <a class="nav-link" href="search-attractions.html">Пребарај атракции</a>
                <a class="nav-link" href="login-register.html">Одјава</a>
            </div>
        </div>
    </nav>

    <!-- Главна содржина -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h3 class="card-title text-primary mb-4">➕ Додади ново патување</h3>
                    
                    <form>
                        <!-- Назив на патувањето -->
                        <div class="mb-3">
                            <label for="tripTitle" class="form-label fw-bold">Наслов на патувањето</label>
                            <input type="text" class="form-control" id="tripTitle" placeholder="пр. Летен одмор во Рим" required>
                        </div>

                        <!-- Дестинација и Валута -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="destination" class="form-label fw-bold">Дестинација (Град/Земја)</label>
                                <input type="text" class="form-control" id="destination" placeholder="пр. Рим, Италија" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="currency" class="form-label fw-bold">Локална валута</label>
                                <select class="form-select" id="currency">
                                    <option value="EUR" selected>EUR (€) - Еуро</option>
                                    <option value="USD">USD ($) - Американски долар</option>
                                    <option value="GBP">GBP (£) - Британска фунта</option>
                                    <option value="MKD">MKD (ден) - Македонски денар</option>
                                </select>
                            </div>
                        </div>

                        <!-- Датуми -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startDate" class="form-label fw-bold">Датум на почеток</label>
                                <input type="date" class="form-control" id="startDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="endDate" class="form-label fw-bold">Датум на завршување</label>
                                <input type="date" class="form-control" id="endDate" required>
                            </div>
                        </div>

                        <!-- Буџет -->
                        <div class="mb-3">
                            <label for="budget" class="form-label fw-bold">Планиран буџет (во денари)</label>
                            <input type="number" class="form-control" id="budget" placeholder="пр. 30000" min="0">
                        </div>

                        <!-- Опис/Забелешки -->
                        <div class="mb-3">
                            <label for="notes" class="form-label fw-bold">Забелешки и план</label>
                            <textarea class="form-control" id="notes" rows="3" placeholder="Краток опис на места што сакате да ги посетите..."></textarea>
                        </div>

                        <!-- Копчиња -->
                        <div class="d-flex justify-content-between">
                            <a href="trips-list.html" class="btn btn-outline-secondary">Откажи</a>
                            <button type="button" class="btn btn-primary">Зачувај патување</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
