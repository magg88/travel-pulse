<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelPulse - Додади Атракција</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Навигација -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pastel shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="index.html">
                <span>✈️</span> TravelPulse
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="main-nav"></ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="/api-docs" target="_blank" class="btn btn-sm btn-outline-light rounded-3">Swagger API</a>
                    <div id="user-info" class="text-white"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Форма за додавање атракција -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-pastel p-4 border-0 shadow-sm rounded-4">
                    <h3 class="fw-bold text-dark mb-3 text-center">🏛️ Додади Нова Атракција</h3>
                    <p class="text-muted text-center mb-4">Пополнете ги деталите за новата предлог дестинација.</p>
                    
                    <form id="add-attraction-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Име на дестинацијата / атракцијата</label>
                            <input type="text" id="attr-name" class="form-control rounded-3" placeholder="Пр: Рим, Италија" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Град / Земја</label>
                            <input type="text" id="attr-city" class="form-control rounded-3" placeholder="Пр: Рим" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Категорија (Значка)</label>
                            <select id="attr-category" class="form-select rounded-3">
                                <option value="Препорачано">Препорачано</option>
                                <option value="Популарно">Популарно</option>
                                <option value="Топ избор">Топ избор</option>
                                <option value="Атрактивно">Атрактивно</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">URL од слика (Unsplash или слично)</label>
                            <input type="url" id="attr-image" class="form-control rounded-3" placeholder="https://images.unsplash.com/..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Краток опис</label>
                            <textarea id="attr-description" class="form-control rounded-3" rows="2" placeholder="Вечниот град, Колисеумот и италијанската кујна..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Детални информации и совети</label>
                            <textarea id="attr-details" class="form-control rounded-3" rows="3" placeholder="🏛️ Топ атракции: Колисеум... 🍕 Препорака: Пробајте Carbonara..."></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <a href="index.html" class="btn btn-outline-secondary w-50 rounded-3 py-2 fw-bold">Откажи</a>
                            <button type="submit" class="btn btn-primary w-50 rounded-3 py-2 fw-bold shadow-sm">Зачувај Атракција</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Футер -->
    <footer class="bg-light text-center text-muted py-4 mt-5 border-top">
        <div class="container">
            <p class="mb-0">© 2026 TravelPulse - Сите права се задржани.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
