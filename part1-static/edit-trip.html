<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelPulse - Уреди патување</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">✈️ TravelPulse</a>
            <div class="navbar-nav">
                <a class="nav-link" href="trips-list.html">Мои патувања</a>
                <a class="nav-link" href="add-trip.html">Ново патување</a>
                <a class="nav-link" href="search-attractions.html">Пребарај атракции</a>
                <a class="nav-link" href="login-register.html">Одјава</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h3 class="card-title text-warning mb-4">✏️ Измени го патувањето</h3>
                    
                    <form>
                        <div class="mb-3">
                            <label for="tripTitle" class="form-label fw-bold">Наслов на патувањето</label>
                            <input type="text" class="form-control" id="tripTitle" value="Летен одмор во Рим" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="destination" class="form-label fw-bold">Дестинација</label>
                                <input type="text" class="form-control" id="destination" value="Рим, Италија" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="currency" class="form-label fw-bold">Валута</label>
                                <select class="form-select" id="currency">
                                    <option value="EUR" selected>EUR (€)</option>
                                    <option value="USD">USD ($)</option>
                                    <option value="MKD">MKD (ден)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startDate" class="form-label fw-bold">Датум на почеток</label>
                                <input type="date" class="form-control" id="startDate" value="2026-07-15" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="endDate" class="form-label fw-bold">Датум на завршување</label>
                                <input type="date" class="form-control" id="endDate" value="2026-07-22" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="budget" class="form-label fw-bold">Планиран буџет (во денари)</label>
                            <input type="number" class="form-control" id="budget" value="30000">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="trips-list.html" class="btn btn-outline-secondary">Откажи</a>
                            <button type="button" class="btn btn-warning">Зачувај ги измените</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
